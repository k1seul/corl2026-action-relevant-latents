# DIFF + ID (Table 1): 2-camera block-causal video transformer, diffusion objective,
# inverse-dynamics loss with lambda = 0.05. Values copied from the config saved inside the
# trained checkpoint (100k steps, 91.3M parameters). This checkpoint is also the
# clip-coupling target of the closed-loop study.
# Usage: python scripts/train.py --config configs/diff_id.yaml

data:
  datasets_dir: "datasets/libero"
  train_split: "data/splits_taskheld/train.json"
  test_split: "data/splits_taskheld/test_indist.json"
  cameras: ["agentview_rgb", "eye_in_hand_rgb"]
  resolution: 128
  clip_len: 32

model:
  patch_size: 16
  dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  dropout: 0.0

train:
  batch_size: 8
  num_workers: 4
  lr: 0.00015
  weight_decay: 0.05
  warmup_steps: 5000
  max_steps: 100000
  mask_ratio: 0.5
  mask_type: "random"
  objective: "diffusion"
  diff_num_steps: 1000
  amp_dtype: "bf16"
  log_interval: 500
  ckpt_interval: 9999999
  ckpt_dir: "runs/diff/diff_id"
  seed: 42
  diff_schedule: "cosine"
  diff_prefix_conditional: True
  ema_decay: 0.9995
  aux_invdyn_lambda: 0.05
  aux_action_dim: 7

eval:
  batch_size: 8
  num_clips: 200
  sample_count: 8
  rollout_prefix: 8
  diff_sample_steps: 50
  out_dir: "runs/diff/diff_id/eval"
